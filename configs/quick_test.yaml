# Fast sanity check on the synthetic dataset (a couple of minutes on CPU).
#   python scripts/make_synthetic_dataset.py --output data/synthetic
#   python main.py --config configs/quick_test.yaml

data_dir: data/synthetic
modality: imu
task: classification
window_size: 100

model: cnn
model_size: small

epochs: 15
batch_size: 64
patience: 5

evaluation: loso
max_folds: 2

shap: false
device: auto
seed: 42
output_dir: outputs
run_name: quick_test
